[package]
name = "swara"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "A LilyPond language server, formatter and player"

[dependencies]
crossbeam-channel = "0.5.17"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tree-sitter = "0.27.1"
# A path dependency until the grammar's v0.1.0 is tagged, then the git dependency pinned to it.
tree-sitter-lilypond = { path = "../../../tree-sitter-lilypond" }

[target.'cfg(unix)'.dependencies]
# Process groups, so stopping a LilyPond run also stops anything it started.
libc = "0.2.191"

[dev-dependencies]
# Built for the tests only: it puts the grammar library where `swara info` is tested.
swara-parser = { path = "../swara-parser" }
