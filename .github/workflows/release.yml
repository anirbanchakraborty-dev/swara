name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.0
  # Swara builds against the grammar in a folder beside its own, at the commit it was tested with.
  GRAMMAR_REV: 2fce2fefb3989aad440cb143b63848f385154940

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Intel archive is cross-compiled on the Apple silicon runner.
          - os: macos-latest
            name: macos
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            targets: aarch64-unknown-linux-gnu
          - os: windows-latest
            name: windows-x86_64
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: swara
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: swara

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anirbanchakraborty-dev/tree-sitter-lilypond
          ref: ${{ env.GRAMMAR_REV }}
          path: tree-sitter-lilypond

      - name: Install Rust
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"
          for target in ${TARGETS}; do
            rustup target add "${target}"
          done

      - name: Build the archives
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${TARGETS}; do
            cargo xtask dist --target "${target}" --out ../dist
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each artifact lands in a folder of its own, so the four SHA256SUMS files stay apart.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: artifacts

      - name: Gather the archives and their checksums
        run: |
          mkdir dist
          find artifacts -type f ! -name SHA256SUMS -exec mv {} dist/ \;
          cat artifacts/*/SHA256SUMS | sort -k 2 > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # The plugin downloads the release named after its own version, so the tag, the program and
      # the plugin must agree, and every platform must have its archive.
      - name: Check the version and every archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(grep -m 1 '^version = "' crates/swara/Cargo.toml)" = "version = \"${version}\""
          grep -qx "return '${version}'" lua/swara/version.lua
          for name in aarch64-apple-darwin.tar.gz x86_64-apple-darwin.tar.gz \
            x86_64-unknown-linux-gnu.tar.gz aarch64-unknown-linux-gnu.tar.gz x86_64-pc-windows-msvc.zip; do
            test -f "dist/swara-${version}-${name}"
          done
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "Swara ${GITHUB_REF_NAME}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md" dist/*
