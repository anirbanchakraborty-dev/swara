name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.0
  LILYPOND_VERSION: 2.26.0
  # Swara builds against the grammar in a folder beside its own, at the commit it was tested with.
  GRAMMAR_REV: 3e50865ce45f2684bf8db5e3731818dbbaebc1d1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lilypond: linux-x86_64
          - os: macos-latest
            lilypond: darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: swara
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: swara

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anirbanchakraborty-dev/tree-sitter-lilypond
          ref: ${{ env.GRAMMAR_REV }}
          path: tree-sitter-lilypond

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      - name: Cache LilyPond
        id: lilypond-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/lilypond
          key: lilypond-${{ env.LILYPOND_VERSION }}-${{ matrix.lilypond }}

      - name: Install LilyPond
        if: steps.lilypond-cache.outputs.cache-hit != 'true'
        env:
          PLATFORM: ${{ matrix.lilypond }}
        run: |
          mkdir -p ~/lilypond
          curl --fail --location --silent --show-error \
            "https://gitlab.com/lilypond/lilypond/-/releases/v${LILYPOND_VERSION}/downloads/lilypond-${LILYPOND_VERSION}-${PLATFORM}.tar.gz" \
            | tar -xz -C ~/lilypond --strip-components=1

      - name: Put LilyPond on the path
        run: |
          echo "$HOME/lilypond/bin" >> "$GITHUB_PATH"

      - name: Show the LilyPond version
        run: lilypond --version | head -n 1

      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      - name: Licences, advisories and sources
        run: cargo deny check

      - name: Tests
        if: runner.os != 'macOS'
        run: cargo test --locked --workspace

      # The ignored tests measure speed against the real LilyPond, so they run on one platform only.
      - name: Tests, with the ignored ones
        if: runner.os == 'macOS'
        run: cargo test --locked --workspace -- --include-ignored

  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nvim: linux-x86_64
            sha256: 474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
          - os: macos-latest
            nvim: macos-arm64
            sha256: 1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b
    runs-on: ${{ matrix.os }}
    env:
      NVIM_VERSION: 0.12.6
    defaults:
      run:
        working-directory: swara
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: swara

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anirbanchakraborty-dev/tree-sitter-lilypond
          ref: ${{ env.GRAMMAR_REV }}
          path: tree-sitter-lilypond

      - name: Install Rust
        run: |
          rustup toolchain install "${RUST_VERSION}" --profile minimal
          rustup default "${RUST_VERSION}"

      # The checksums are the ones GitHub publishes for each asset of the Neovim release.
      - name: Install Neovim
        env:
          ARCHIVE: nvim-${{ matrix.nvim }}.tar.gz
          SHA256: ${{ matrix.sha256 }}
        run: |
          curl --fail --location --silent --show-error --output "${RUNNER_TEMP}/${ARCHIVE}" \
            "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/${ARCHIVE}"
          echo "${SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | shasum -a 256 --check
          mkdir -p ~/nvim
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C ~/nvim --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"

      - name: Show the Neovim version
        run: nvim --version | head -n 1

      - name: Build swara
        run: cargo build --locked -p swara -p swara-parser

      - name: Queries match the grammar
        run: cargo xtask check-queries

      - name: Plugin tests
        run: nvim --clean --headless -l tests/run.lua
